name: Sync file list from another repo

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main page repo
        uses: actions/checkout@v5

      - name: Fetch file list and rebuild list block in index.html
        run: |
          python3 << 'PYEOF'
          import json, re, sys, urllib.parse, urllib.request

          REPO = "kongzi-lab/kuang-di-cheng-sheng"
          SITE = "https://kongzi-lab.github.io/kuang-di-cheng-sheng/"
          SKIP_NAMES = {"readme.md", ".nojekyll", ".gitignore", "license"}

          tree = None
          for ref in ("HEAD", "main", "master"):
              try:
                  url = f"https://api.github.com/repos/{REPO}/git/trees/{ref}?recursive=1"
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "pages-sync",
                          "Accept": "application/vnd.github+json",
                      },
                  )
                  with urllib.request.urlopen(req) as resp:
                      tree = json.load(resp)
                  break
              except Exception as e:
                  print(f"Fetch ref {ref} failed: {e}")
          if tree is None:
              sys.exit("Failed to fetch file tree of kuang-di-cheng-sheng repo")

          files = [i["path"] for i in tree.get("tree", []) if i["type"] == "blob"]

          show = []
          for p in files:
              name = p.split("/")[-1]
              if name.startswith("."):
                  continue
              if name.lower() in SKIP_NAMES:
                  continue
              show.append(p)
          show.sort(key=lambda p: (p.count("/"), p))

          lines = ['<ul class="repo-file-list">']
          for p in show:
              link = p[:-3] + ".html" if p.endswith(".md") else p
              href = SITE + urllib.parse.quote(link)
              lines.append(f'  <li><a href="{href}" target="_blank">{p}</a></li>')
          lines.append("</ul>")
          block = "\n".join(lines)

          with open("index.html", encoding="utf-8") as f:
              html = f.read()

          start_tag = "<!-- FILE_LIST_START -->"
          end_tag = "<!-- FILE_LIST_END -->"
          if start_tag not in html or end_tag not in html:
              sys.exit(
                  "index.html does not contain FILE_LIST_START / FILE_LIST_END markers. "
                  "Please add these two marker lines first."
              )

          new_html = re.sub(
              re.escape(start_tag) + r".*?" + re.escape(end_tag),
              start_tag + "\n" + block + "\n" + end_tag,
              html,
              flags=re.S,
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_html)
          print(f"File list updated, {len(show)} files in total")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update file list from kuang-di-cheng-sheng"
          git push
